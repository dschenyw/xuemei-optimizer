name: Build and publish Xuemei v5.2.5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_v525.py'
      - '.github/workflows/release-v5.2.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Download v5.2.4 base
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fL --retry 3 'https://github.com/dschenyw/xuemei-optimizer/releases/download/v5.2.4/Xuemei-Optimizer-v5.2.4-Update.zip' -o work/base.zip
          ditto -x -k work/base.zip work/extract
          APP="$(find work/extract -maxdepth 3 -type d -name '雪梅优化.app' -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Patch v5.2.5 architecture
        run: |
          set -euo pipefail
          python3 scripts/release_v525.py "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 5.2.5' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 5.2.5' "$APP/Contents/Info.plist" || true
          grep -q 'XMCVersion = @"5.2.5"' "$APP/Contents/Resources/main.m"
          grep -q '^VERSION="5.2.5"' "$APP/Contents/Resources/engine.sh"
          grep -q 'UPDATE_ARCHITECTURE="PREBUILT_VERIFIED_ATOMIC_V1"' "$APP/Contents/Resources/engine.sh"
      - name: Compile sign and verify once on CI
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CLANG="$(xcrun --find clang)"
          "$CLANG" -fobjc-arc -fmodules -isysroot "$SDK" -mmacosx-version-min=12.0 -framework Cocoa "$APP/Contents/Resources/main.m" -o "$APP/Contents/MacOS/XueMeiCleanerNative"
          chmod +x "$APP/Contents/MacOS/XueMeiCleanerNative" "$APP/Contents/Resources/engine.sh"
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Package and manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "$APP" 'dist/雪梅优化.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/雪梅优化.app' 'dist/Xuemei-Optimizer-v5.2.5-Update.zip'
          SHA="$(shasum -a 256 'dist/Xuemei-Optimizer-v5.2.5-Update.zip' | awk '{print $1}')"
          cat > dist/manifest.json <<EOF
          {
            "version": "5.2.5",
            "download_url": "https://github.com/dschenyw/xuemei-optimizer/releases/download/v5.2.5/Xuemei-Optimizer-v5.2.5-Update.zip",
            "sha256": "$SHA"
          }
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v5.2.5 >/dev/null 2>&1 && gh release delete v5.2.5 --yes --cleanup-tag || true
          gh release create v5.2.5 'dist/Xuemei-Optimizer-v5.2.5-Update.zip' --title 'Xuemei Optimizer v5.2.5' --notes '更新架构重修：客户端不再二次编译；下载后校验 SHA-256、Bundle ID、版本和签名，备份后原子替换；失败显示具体阶段。'
      - name: Publish fixed manifest
        run: |
          set -euo pipefail
          cp dist/manifest.json updates/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Xuemei Optimizer v5.2.5 manifest'
            git push
          fi
