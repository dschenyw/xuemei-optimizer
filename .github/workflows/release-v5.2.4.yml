name: Build and publish Xuemei v5.2.4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_v524.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download v5.2.3 update base
        run: |
          set -euo pipefail
          mkdir -p work/base
          curl -fL --retry 3 \
            'https://github.com/dschenyw/xuemei-optimizer/releases/download/v5.2.3/_v5.2.3_Update.zip' \
            -o work/base/v5.2.3.zip
          ditto -x -k work/base/v5.2.3.zip work/base/extract
          APP="$(find work/base/extract -maxdepth 3 -type d -name '雪梅优化.app' -print -quit)"
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Patch v5.2.4 sources
        run: |
          set -euo pipefail
          python3 scripts/release_v524.py "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 5.2.4' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 5.2.4' "$APP/Contents/Info.plist" || true
          grep -q 'XMCVersion = @"5.2.4"' "$APP/Contents/Resources/main.m"
          grep -q '^VERSION="5.2.4"' "$APP/Contents/Resources/engine.sh"
          grep -q 'installer_auto_scan_v524_cmd' "$APP/Contents/Resources/engine.sh"
          grep -q 'autoScanInstallers:' "$APP/Contents/Resources/main.m"

      - name: Compile and sign native app
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CLANG="$(xcrun --find clang)"
          "$CLANG" -fobjc-arc -fmodules -isysroot "$SDK" -mmacosx-version-min=12.0 \
            -framework Cocoa "$APP/Contents/Resources/main.m" \
            -o "$APP/Contents/MacOS/XueMeiCleanerNative"
          chmod +x "$APP/Contents/MacOS/XueMeiCleanerNative" "$APP/Contents/Resources/engine.sh"
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package update
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "$APP" 'dist/雪梅优化.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/雪梅优化.app' 'dist/Xuemei-Optimizer-v5.2.4-Update.zip'
          SHA="$(shasum -a 256 'dist/Xuemei-Optimizer-v5.2.4-Update.zip' | awk '{print $1}')"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          cat > dist/manifest.json <<EOF
          {
            "version": "5.2.4",
            "download_url": "https://github.com/dschenyw/xuemei-optimizer/releases/download/v5.2.4/Xuemei-Optimizer-v5.2.4-Update.zip",
            "sha256": "$SHA"
          }
          EOF
          cat dist/manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v5.2.4 >/dev/null 2>&1 && gh release delete v5.2.4 --yes --cleanup-tag || true
          gh release create v5.2.4 'dist/Xuemei-Optimizer-v5.2.4-Update.zip' \
            --title 'Xuemei Optimizer v5.2.4' \
            --notes '安装包清理自动扫描：Downloads/Desktop/Documents/Public；自动判断旧版本、损坏/失效、已安装残留；保留高级手动扫描。'

      - name: Update fixed manifest
        run: |
          set -euo pipefail
          cp dist/manifest.json updates/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Xuemei Optimizer v5.2.4 manifest'
            git push
          fi
